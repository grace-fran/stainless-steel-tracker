name: Auto Stainless Steel Price Scraper

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 時間每天 01:00 (台灣時間早上 09:00 執行)
  workflow_dispatch:      # 允許在 GitHub 頁面上點擊按鈕手動執行

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update price data [skip ci]" || exit 0
          git push
